[project]
name = "hostel-management"
version = "1.0.0"
description = "Simple Flask hostel management system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator==2.3.0",
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "gunicorn==23.0.0",
    "python-dotenv==1.2.3",
    "psycopg[binary]==3.2.10",
    "SQLAlchemy==2.0.52",
]

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
check_untyped_defs = true
exclude = ["migrations/"]
