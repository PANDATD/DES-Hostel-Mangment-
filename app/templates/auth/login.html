{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Sign in</h1>
  <p class="muted">Admin and student access.</p>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>{{ form.login.label }}{{ form.login(autocomplete="username") }}</label>
    <label>{{ form.password.label }}{{ form.password(autocomplete="current-password") }}</label>
    {{ form.submit(class_="primary") }}
  </form>
  <p><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
</div>
{% endblock %}
