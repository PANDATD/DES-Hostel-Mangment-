{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Reset password</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>{{ form.password.label }}{{ form.password(autocomplete="new-password") }}</label>
    <label>{{ form.confirm_password.label }}{{ form.confirm_password(autocomplete="new-password") }}</label>
    <div>{{ form.submit(class_="primary") }}</div>
  </form>
</div>
{% endblock %}
