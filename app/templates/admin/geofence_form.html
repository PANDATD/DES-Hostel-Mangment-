{% extends "base.html" %}{% block title %}{{ 'Edit' if geofence else 'Create' }} Geofence{% endblock %}{% block content %}<h1>{{ 'Edit' if geofence else 'Create' }} geofence</h1><div class="card"><form method="post" class="form-grid">{{ form.hidden_tag() }}<label>{{ form.name.label }}{{ form.name() }}</label><label>{{ form.latitude.label }}{{ form.latitude() }}</label><label>{{ form.longitude.label }}{{ form.longitude() }}</label><label>{{ form.radius_metres.label }}{{ form.radius_metres() }}</label><label>{{ form.max_accuracy_metres.label }}{{ form.max_accuracy_metres() }}</label><label>{{ form.check_in_start.label }}{{ form.check_in_start() }}</label><label>{{ form.check_in_end.label }}{{ form.check_in_end() }}</label><label>{{ form.late_after.label }}{{ form.late_after() }}</label><label>{{ form.timezone.label }}{{ form.timezone() }}</label><label class="checkbox-label">{{ form.active() }} {{ form.active.label.text }}</label><div>{{ form.submit(class_="primary") }} <a class="secondary" href="{{ url_for('admin.attendance') }}">Cancel</a></div></form></div>{% endblock %}
