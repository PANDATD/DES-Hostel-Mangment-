{% extends "base.html" %}{% block title %}{{ 'Edit' if room else 'Create' }} Room{% endblock %}{% block content %}<h1>{{ 'Edit' if room else 'Create' }} room</h1><div class="card"><form method="post" class="form-grid">{{ form.hidden_tag() }}<label>{{ form.block_id.label }}{{ form.block_id() }}</label><label>{{ form.number.label }}{{ form.number() }}</label><label>{{ form.floor.label }}{{ form.floor() }}</label><label>{{ form.capacity.label }}{{ form.capacity() }}</label><label class="checkbox-label">{{ form.active() }} {{ form.active.label.text }}</label><div>{{ form.submit(class_="primary") }} <a class="secondary" href="{{ url_for('admin.rooms') }}">Cancel</a></div></form></div>{% endblock %}
