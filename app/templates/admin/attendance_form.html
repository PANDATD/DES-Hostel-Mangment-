{% extends "base.html" %}{% block title %}Edit Attendance{% endblock %}{% block content %}<h1>Edit attendance</h1><div class="card"><p><strong>{{ record.student.student_code }} — {{ record.student.full_name }}</strong></p><form method="post" class="form-grid">{{ form.hidden_tag() }}<label>{{ form.attendance_date.label }}{{ form.attendance_date() }}</label><label class="checkbox-label">{{ form.is_late() }} {{ form.is_late.label.text }}</label><div>{{ form.submit(class_="primary") }} <a class="secondary" href="{{ url_for('admin.attendance') }}">Cancel</a></div></form></div>{% endblock %}
