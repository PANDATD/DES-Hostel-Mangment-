{% extends "base.html" %}{% block title %}Edit Fee{% endblock %}{% block content %}<h1>Edit fee</h1><div class="card"><form method="post" class="form-grid">{{ form.hidden_tag() }}<label>{{ form.student_id.label }}{{ form.student_id() }}</label><label>{{ form.academic_year_id.label }}{{ form.academic_year_id() }}</label><label>{{ form.fee_type_id.label }}{{ form.fee_type_id() }}</label><label>{{ form.amount_due.label }}{{ form.amount_due() }}</label><label>{{ form.due_date.label }}{{ form.due_date() }}</label><label class="wide">{{ form.notes.label }}{{ form.notes() }}</label><div>{{ form.submit(class_="primary") }} <a class="secondary" href="{{ url_for('admin.fees') }}">Cancel</a></div></form></div>{% endblock %}
